[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-site-preflight"
version = "0.1.0.dev0"
description = "Evidence-backed HPC site profiling and portable workflow preflight."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Md Saiful Islam"}
]
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9.14.4,<10",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2"
]

[project.scripts]
hpc-site-preflight = "hpc_site_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpc_site_preflight = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["hpc_site_preflight"]
